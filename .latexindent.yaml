semantic_wrap:
  soft_width: 80
  hard_width: 100
  preferred_markers: ',;:-–—'
  continuation_indent: 0

defaultIndent: '    '

noAdditionalIndent:
  item: 1
  itemize: 1
  enumerate: 1
  description: 1

noAdditionalIndentGlobal:
  items: 1

modifyLineBreaks:
  items:
    ItemFinishesWithLineBreak: -1
  oneSentencePerLine:
    manipulateSentences: 1
    removeSentenceLineBreaks: 1
    textWrapSentences: 1
    sentenceIndent: ''
  textWrapOptions:
    columns: 100
    when: after
    huge: overflow
